name: Auto Unzip (DG only)

on:
  push:
    branches: [main]
    paths: ['**.zip', '**.ZIP']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: DG zip kholo baqi delete karo
        shell: bash
        run: |
          set -e
          for z in $(find . -path ./.git -prune -o -type f -iname '*.zip' -print); do
            name=$(basename "$z")
            case "$name" in
              DG*)
                echo "OK $name"
                rm -rf /tmp/x
                mkdir /tmp/x
                unzip -oq "$z" -d /tmp/x
                rm -rf /tmp/x/.github /tmp/x/.git
                cp -a /tmp/x/. .
                ;;
              *)
                echo "REJECTED $name"
                ;;
            esac
            rm -f "$z"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "auto unzip"
          git pull --rebase
          git push
