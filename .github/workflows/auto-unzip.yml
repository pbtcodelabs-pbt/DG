# DG Khatabook — زپ فائل اپ لوڈ کریں، باقی کام یہ خود کرے گا
name: Auto Unzip & Deploy

on:
  push:
    branches: [main]
    paths: ['**.zip', '**.ZIP']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: auto-unzip
  cancel-in-progress: false

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        id: un
        run: |
          shopt -s nullglob globstar nocaseglob
          zips=( **/*.zip )
          if [ ${#zips[@]} -eq 0 ]; then echo "none=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          names=""
          for z in "${zips[@]}"; do
            tmp=$(mktemp -d)
            unzip -o -q "$z" -d "$tmp"
            rm -rf "$tmp/__MACOSX"
            top=( "$tmp"/* )
            if [ ${#top[@]} -eq 1 ] && [ -d "${top[0]}" ]; then src="${top[0]}"; else src="$tmp"; fi
            rm -rf "$src/.github" "$src/.git"
            dest=$(dirname "$z")
            cp -a "$src"/. "$dest"/
            git rm -q --cached "$z" 2>/dev/null || true
            rm -f "$z"
            rm -rf "$tmp"
            names="$names $(basename "$z" .zip)"
          done
          echo "names=$names" >> "$GITHUB_OUTPUT"

      - name: Commit
        if: steps.un.outputs.none != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Auto-unzip:${{ steps.un.outputs.names }}"
          git push

      - name: Rebuild GitHub Pages
        if: steps.un.outputs.none != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "skip"
