# DG Khatabook — خودکار زپ کھولنے والا
# اصول: صرف وہ زپ کھلے گی جس کا نام "DG" سے شروع ہو (مثلاً DG210FR009.zip)
# باقی ہر زپ بغیر کھولے خود ڈیلیٹ ہو جائے گی

name: Auto Unzip (DG only)

on:
  push:
    branches: [main]
    paths: ['**.zip', '**.ZIP']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-unzip
  cancel-in-progress: false

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: DG zip kholo, baqi delete karo
        shell: bash
        run: |
          set -e
          changed=0
          while IFS= read -r -d '' z; do
            name="$(basename "$z")"
            if [[ "$name" == DG* ]]; then
              echo "OK: $name — khol rahe hain"
              tmp="$(mktemp -d)"
              unzip -oq "$z" -d "$tmp"
              src="$tmp"
              only="$(find "$tmp" -mindepth 1 -maxdepth 1)"
              if [ "$(printf '%s\n' "$only" | wc -l)" = "1" ] && [ -f "$only/index.html" ]; then src="$only"; fi
              rm -rf "$src/.github" "$src/.git"
              cp -a "$src"/. .
              rm -rf "$tmp"
            else
              echo "REJECTED: $name — naam DG se shuru nahi hota, delete kar di"
            fi
